<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1f33">
<title>Cadastro de Drenagem Urbana</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3u9hW5u0p4m0k2F8e5x5Q5z5Q5z5Q="
 crossorigin="">


<style>
*{box-sizing:border-box}

:root{
  --azul-950:#071a2b;
  --azul-900:#0b2742;
  --azul-800:#103b63;
  --azul-700:#15558d;
  --azul-600:#1d6da8;
  --azul-500:#2586c7;
  --azul-100:#e8f3fb;
  --azul-050:#f4f9fd;
  --texto:#12263a;
  --borda:#cbd9e5;
  --fundo:#edf3f8;
  --branco:#fff;
  --sucesso:#087443;
  --perigo:#b42318;
}

body{
  margin:0;
  background:linear-gradient(180deg,#eaf2f8 0%,#f5f8fb 100%);
  color:var(--texto);
  font-family:"Montserrat",Arial,Helvetica,sans-serif;
}

header{
  background:linear-gradient(135deg,var(--azul-950),var(--azul-800));
  color:#fff;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 14px #071a2b55;
}

header h1{
  margin:0;
  font-size:19px;
  font-weight:800;
  letter-spacing:.2px;
}

header p{
  margin:6px 0 0;
  font-size:11px;
  font-weight:500;
  opacity:.82;
}

.container{
  max-width:920px;
  margin:auto;
  padding:14px;
}

/* CARD PRINCIPAL DO CADASTRO */
.cadastro-card{
  background:var(--branco);
  border:1px solid #d8e3ec;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 5px 22px #0b274218;
}

.card-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 15px;
  color:var(--azul-900);
  font-size:17px;
  font-weight:800;
}

.card-title .icon{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:var(--azul-100);
  font-size:20px;
}

.section{
  border-top:1px solid #e2eaf1;
  padding-top:12px;
  margin-top:14px;
}

.section-title{
  color:var(--azul-800);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:8px;
}

label{
  display:block;
  font-size:11px;
  font-weight:700;
  margin:11px 0 5px;
  color:#28445d;
}

input,select,textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--borda);
  border-radius:10px;
  font-family:inherit;
  font-size:14px;
  color:var(--texto);
  background:#fff;
  outline:none;
  transition:.15s;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--azul-500);
  box-shadow:0 0 0 3px #2586c71c;
}

textarea{
  min-height:82px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  margin:4px 2px;
  transition:.15s;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--azul-900);
  color:#fff;
}

.gps{
  background:var(--azul-700);
  color:#fff;
  width:100%;
  margin-top:10px;
}

.save{
  background:linear-gradient(135deg,var(--azul-700),var(--azul-900));
  color:white;
  width:100%;
  font-size:15px;
  padding:15px;
  margin-top:15px;
  box-shadow:0 5px 12px #0b274233;
}

.secondary{
  background:#e7eef5;
  color:var(--azul-900);
}

.danger{
  background:var(--perigo);
  color:white;
}

#map{
  height:350px;
  border-radius:13px;
  overflow:hidden;
  border:1px solid #cfdae4;
}

.status{
  padding:10px 12px;
  border-radius:9px;
  background:var(--azul-050);
  border:1px solid #d5e6f3;
  color:var(--azul-800);
  font-size:11px;
  line-height:1.55;
  margin-top:8px;
}

.suggestions{
  max-height:220px;
  overflow:auto;
  border:1px solid #ccd9e4;
  border-top:0;
  border-radius:0 0 9px 9px;
  display:none;
}

.suggestion{
  padding:11px;
  background:white;
  border-bottom:1px solid #edf1f4;
  cursor:pointer;
  font-size:12px;
}

.suggestion:hover{
  background:var(--azul-050);
}

.suggestion small{
  color:#65798b;
}

/* CHECKBOXES DOS PROBLEMAS */
.checkbox-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:7px;
}

.check-item{
  position:relative;
}

.check-item input{
  position:absolute;
  opacity:0;
  width:0;
  height:0;
}

.check-item label{
  display:flex;
  align-items:center;
  min-height:43px;
  margin:0;
  padding:9px 10px;
  border:1px solid #d2dee8;
  border-radius:10px;
  background:#f8fafc;
  color:#29445a;
  font-size:11px;
  font-weight:600;
  line-height:1.25;
  cursor:pointer;
  transition:.15s;
}

.check-item label::before{
  content:"";
  width:19px;
  height:19px;
  flex:0 0 19px;
  margin-right:8px;
  border:2px solid #9eb3c4;
  border-radius:5px;
  background:#fff;
}

.check-item input:checked + label{
  background:var(--azul-100);
  border-color:var(--azul-500);
  color:var(--azul-900);
  font-weight:800;
}

.check-item input:checked + label::before{
  content:"✓";
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--azul-700);
  border-color:var(--azul-700);
  color:#fff;
  font-size:13px;
  font-weight:900;
}

.checkbox-hint{
  font-size:10px;
  color:#687d8e;
  margin-top:7px;
}

/* CARDS DE REGISTROS */
.records{
  background:#fff;
  border:1px solid #d8e3ec;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 15px #0b274214;
}

.records h2{
  color:var(--azul-900);
  font-size:16px;
  margin:0 0 10px;
}

.record{
  border:1px solid #d9e3eb;
  border-left:4px solid var(--azul-600);
  border-radius:10px;
  padding:11px;
  margin:8px 0;
  background:#f9fbfd;
}

.record strong{
  font-size:13px;
  color:var(--azul-900);
}

.record small{
  display:block;
  color:#526879;
  margin-top:4px;
  font-size:10px;
  line-height:1.4;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  background:var(--azul-100);
  color:var(--azul-800);
  font-size:9px;
  font-weight:800;
  margin-top:5px;
}

.toolbar{
  background:#fff;
  border:1px solid #d8e3ec;
  border-radius:14px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #0b274210;
}

@media(max-width:600px){
  .container{padding:10px}
  .cadastro-card{padding:14px;border-radius:15px}
  .row{grid-template-columns:1fr}
  .checkbox-grid{grid-template-columns:1fr}
  #map{height:310px}
}
</style>

</head>

<body>
<header>
  <h1>📍 Cadastro de Drenagem Urbana</h1>
  <p>Cadastro georreferenciado de Boca de Lobo e Caixa de Leão</p>
</header>

<div class="container">

  <div class="cadastro-card">
    <div class="card-title">
      <span class="icon">🗺️</span>
      <span>Localização</span>
    </div>
    <div id="map"></div>
    <button class="gps" onclick="capturarGPS()">📍 Capturar minha localização</button>
    <div id="gpsStatus" class="status">GPS ainda não capturado.</div>
  </div>

  <div class="cadastro-card">
    <div class="card-title">
      <span class="icon">📝</span>
      <span>Novo cadastro</span>
    </div>

    <label for="logradouroBusca">🔎 Logradouro oficial</label>
    <input id="logradouroBusca" autocomplete="off"
           placeholder="Digite o nome da rua, avenida, praça..."
           oninput="buscarLogradouro()">
    <div id="sugestoes" class="suggestions"></div>

    <input type="hidden" id="numeroRuaOficial">

    <div class="row">
      <div>
        <label>Tipo</label>
        <select id="tipo">
          <option value="Boca de Lobo">Boca de Lobo</option>
          <option value="Caixa de Leão">Caixa de Leão</option>
        </select>
      </div>
      <div>
        <label>Número da estrutura</label>
        <input id="numero" inputmode="numeric" placeholder="Ex.: 125">
      </div>
    </div>

    <label>Bairro</label>
    <input id="bairro" readonly placeholder="Preenchido pelo logradouro oficial">

    <label>Posição na via</label>
    <select id="posicao">
      <option value="">Selecione</option>
      <option>Direita</option>
      <option>Esquerda</option>
      <option>Centro</option>
    </select>

    <div class="section">
      <div class="section-title">⚠️ Problemas / condições</div>

      <div class="checkbox-grid" id="problemas">
        <div class="check-item">
          <input type="checkbox" id="p1" value="Limpeza">
          <label for="p1">Limpeza</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p2" value="Trocar tampa">
          <label for="p2">Trocar tampa</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p3" value="Trocar guia">
          <label for="p3">Trocar guia</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p4" value="Refazer caixa">
          <label for="p4">Refazer caixa</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p5" value="Obstrução tubulação">
          <label for="p5">Obstrução tubulação</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p6" value="Afundamento caixa">
          <label for="p6">Afundamento caixa</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p7" value="Solapamento tubulação">
          <label for="p7">Solapamento tubulação</label>
        </div>
        <div class="check-item">
          <input type="checkbox" id="p8" value="Fora de padrão">
          <label for="p8">Fora de padrão</label>
        </div>
      </div>

      <div class="checkbox-hint">Você pode marcar uma ou várias condições.</div>
    </div>

    <label>Observações</label>
    <textarea id="obs" placeholder="Informações complementares..."></textarea>

    <label>Foto</label>
    <input id="foto" type="file" accept="image/*" capture="environment">

    <button class="save" onclick="salvarRegistro()">💾 SALVAR CADASTRO</button>
  </div>

  <div class="toolbar">
    <button class="secondary" onclick="exportarCSV()">⬇️ Exportar CSV</button>
    <button class="secondary" onclick="limparTudo()">🗑️ Apagar registros locais</button>
  </div>

  <div class="card records">
    <h2>📋 Registros salvos: <span id="contador">0</span></h2>
    <div id="lista"></div>
  </div>

</div>

/VIELA":null,"VILA":null,"BAIRRO":null,"DECRETO OU LEI":null,"REVISADO":"SIM","COORDENADAS":"-23.629819, -46.376382","SEM SAÍDA":null,"FECHADA":null,"FECHADA PARCIALMENTE":null,"EM PROJETO":null},{"NÚMERO DA RUA":"27010002","TIPO":"PRAÇA","COMPLEMENTO DO NOME":null,"NOME":"JOSÉ MAZIERO","NOME ANTERIOR DA RUA":null,"LOCALIZAÇÃO NO MAPA OFICIAL":"K9","TERRA":null,"BLOQUETE":null,"PARALELEPÍPEDO":null,"ASFALTO":null,"NOME COMPLETO":null,"CEP":null,"METRAGEM ESCADARIA/VIELA":null,"VILA":null,"BAIRRO":null,"DECRETO OU LEI":null,"REVISADO":"NÃO","COORDENADAS":null,"SEM SAÍDA":null,"FECHADA":null,"FECHADA PARCIALMENTE":null,"EM PROJETO":null},{"NÚMERO DA RUA":"27020001","TIPO":"PRAÇA","COMPLEMENTO DO NOME":"DAS","NOME":"MONÇÕES","NOME ANTERIOR DA RUA":null,"LOCALIZAÇÃO NO MAPA OFICIAL":null,"TERRA":null,"BLOQUETE":null,"PARALELEPÍPEDO":null,"ASFALTO":null,"NOME COMPLETO":null,"CEP":null,"METRAGEM ESCADARIA/VIELA":null,"VILA":"RECANTO VISTA ALEGRE","BAIRRO":null,"DECRETO OU LEI":null,"REVISADO":"NÃO","COORDENADAS":null,"SEM SAÍDA":null,"FECHADA":null,"FECHADA PARCIALMENTE":null,"EM PROJETO":null}];

// ============================================================
// CONFIGURAÇÃO
// ============================================================
const STORAGE_KEY = "drenagem_urbana_registros_v1";

let registros = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let latitude = null;
let longitude = null;
let precisao = null;
let gpsMarker = null;
let viasFiltradas = [];

// ============================================================
// MAPA
// ============================================================
const map = L.map("map").setView([-23.71, -46.41], 14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 20,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

// Mostra registros existentes
registros.forEach(adicionarMarcador);

// ============================================================
// LOGRADOUROS
// ============================================================
function nomeCompletoVia(v) {
  if (v["NOME COMPLETO"]) return v["NOME COMPLETO"];

  const tipo = (v["TIPO"] || "").trim();
  const complemento = (v["COMPLEMENTO DO NOME"] || "").trim();
  const nome = (v["NOME"] || "").trim();

  return [tipo, complemento, nome].filter(Boolean).join(" ").replace(/\s+/g, " ");
}

function buscarLogradouro() {
  const termo = normalizar(document.getElementById("logradouroBusca").value);
  const box = document.getElementById("sugestoes");

  if (termo.length < 2) {
    box.style.display = "none";
    return;
  }

  viasFiltradas = VIAS_OFICIAIS
    .filter(v => {
      const nome = normalizar(nomeCompletoVia(v));
      const bairro = normalizar(v["BAIRRO"] || "");
      return nome.includes(termo) || bairro.includes(termo);
    })
    .slice(0, 30);

  box.innerHTML = "";

  viasFiltradas.forEach((v, i) => {
    const div = document.createElement("div");
    div.className = "suggestion";
    div.innerHTML =
      "<strong>" + escapeHtml(nomeCompletoVia(v)) + "</strong>" +
      "<br><small>" +
      escapeHtml(v["BAIRRO"] || "") +
      (v["CEP"] ? " • CEP " + escapeHtml(v["CEP"]) : "") +
      "</small>";
    div.onclick = () => selecionarVia(i);
    box.appendChild(div);
  });

  box.style.display = viasFiltradas.length ? "block" : "none";
}

function selecionarVia(index) {
  const v = viasFiltradas[index];

  document.getElementById("logradouroBusca").value = nomeCompletoVia(v);
  document.getElementById("bairro").value = v["BAIRRO"] || "";
  document.getElementById("numeroRuaOficial").value = v["NÚMERO DA RUA"] || "";

  document.getElementById("sugestoes").style.display = "none";

  // Se a via possui coordenadas oficiais, mostra no mapa como referência.
  const c = parseCoordenadas(v["COORDENADAS"]);
  if (c) {
    map.setView(c, 17);
  }
}

// ============================================================
// GPS
// ============================================================
function capturarGPS() {
  const status = document.getElementById("gpsStatus");

  if (!navigator.geolocation) {
    status.textContent = "❌ Este navegador não oferece GPS.";
    return;
  }

  status.textContent = "⏳ Obtendo localização...";

  navigator.geolocation.getCurrentPosition(
    pos => {
      latitude = pos.coords.latitude;
      longitude = pos.coords.longitude;
      precisao = pos.coords.accuracy;

      map.setView([latitude, longitude], 19);

      if (gpsMarker) map.removeLayer(gpsMarker);

      gpsMarker = L.marker([latitude, longitude])
        .addTo(map)
        .bindPopup("📍 Minha posição GPS")
        .openPopup();

      status.innerHTML =
        "✅ GPS capturado<br>" +
        "Latitude: " + latitude.toFixed(7) +
        " • Longitude: " + longitude.toFixed(7) +
        "<br>Precisão aproximada: " + Math.round(precisao) + " m";
    },
    err => {
      status.textContent =
        "❌ Não foi possível obter o GPS. Verifique a permissão de localização.";
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 5000
    }
  );
}

// ============================================================
// SALVAR
// ============================================================
function salvarRegistro() {
  if (latitude === null || longitude === null) {
    alert("Primeiro capture a localização GPS.");
    return;
  }

  const logradouro = document.getElementById("logradouroBusca").value.trim();
  const bairro = document.getElementById("bairro").value.trim();

  if (!logradouro) {
    alert("Selecione um logradouro oficial.");
    return;
  }

  const tipo = document.getElementById("tipo").value;
  const id = gerarID(tipo);

  const problemas = Array.from(
    document.querySelectorAll("#problemas input[type='checkbox']:checked")
  ).map(c => c.value);

  const agora = new Date();

  const registro = {
    id,
    data: agora.toLocaleDateString("pt-BR"),
    hora: agora.toLocaleTimeString("pt-BR"),
    tipo,
    logradouro,
    numero: document.getElementById("numero").value.trim(),
    bairro,
    posicao: document.getElementById("posicao").value,
    problemas,
    observacoes: document.getElementById("obs").value.trim(),
    latitude,
    longitude,
    precisao_gps: precisao,
    numero_via_oficial: document.getElementById("numeroRuaOficial").value
  };

  registros.push(registro);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));

  adicionarMarcador(registro);
  renderizarRegistros();

  alert("Cadastro salvo com sucesso: " + id);
  limparFormulario();
}

function gerarID(tipo) {
  const prefixo = tipo === "Boca de Lobo" ? "BL" : "CL";

  const existentes = registros
    .filter(r => r.id && r.id.startsWith(prefixo + "-"))
    .map(r => parseInt(r.id.split("-")[1]) || 0);

  const proximo = (existentes.length ? Math.max(...existentes) : 0) + 1;

  return prefixo + "-" + String(proximo).padStart(5, "0");
}

function limparFormulario() {
  document.getElementById("logradouroBusca").value = "";
  document.getElementById("bairro").value = "";
  document.getElementById("numeroRuaOficial").value = "";
  document.getElementById("numero").value = "";
  document.getElementById("posicao").value = "";
  document.getElementById("obs").value = "";
  document.querySelectorAll("#problemas input[type='checkbox']")
    .forEach(c => c.checked = false);
  document.getElementById("foto").value = "";
  latitude = null;
  longitude = null;
  precisao = null;
  document.getElementById("gpsStatus").textContent = "GPS ainda não capturado.";
}

// ============================================================
// MARCADORES
// ============================================================
function adicionarMarcador(r) {
  if (!r.latitude || !r.longitude) return;

  const marcador = L.marker([r.latitude, r.longitude]).addTo(map);

  marcador.bindPopup(
    "<strong>" + escapeHtml(r.id) + "</strong><br>" +
    escapeHtml(r.tipo) + "<br>" +
    escapeHtml(r.logradouro) +
    (r.numero ? ", " + escapeHtml(r.numero) : "") +
    "<br>" + escapeHtml(r.bairro || "")
  );
}

// ============================================================
// LISTAGEM
// ============================================================
function renderizarRegistros() {
  document.getElementById("contador").textContent = registros.length;

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  registros.slice().reverse().forEach(r => {
    const div = document.createElement("div");
    div.className = "record";

    div.innerHTML =
      "<strong>" + escapeHtml(r.id) + " — " + escapeHtml(r.tipo) + "</strong>" +
      "<span class='badge'>" + escapeHtml(r.data) + " " + escapeHtml(r.hora) + "</span>" +
      "<small>📍 " + escapeHtml(r.logradouro) +
      (r.numero ? ", " + escapeHtml(r.numero) : "") +
      "</small>" +
      "<small>🏘️ " + escapeHtml(r.bairro || "—") + "</small>" +
      "<small>🛰️ " + r.latitude.toFixed(7) + ", " + r.longitude.toFixed(7) + "</small>" +
      (r.posicao ? "<small>↔️ " + escapeHtml(r.posicao) + "</small>" : "") +
      (r.problemas && r.problemas.length ?
        "<small>⚠️ " + escapeHtml(r.problemas.join(", ")) + "</small>" : "") +
      (r.observacoes ?
        "<small>📝 " + escapeHtml(r.observacoes) + "</small>" : "");

    lista.appendChild(div);
  });
}

// ============================================================
// CSV
// ============================================================
function exportarCSV() {
  if (!registros.length) {
    alert("Não há registros para exportar.");
    return;
  }

  const campos = [
    "id","data","hora","tipo","logradouro","numero","bairro",
    "posicao","problemas","observacoes","latitude","longitude",
    "precisao_gps","numero_via_oficial"
  ];

  const linhas = [
    campos.join(";"),
    ...registros.map(r =>
      campos.map(c => {
        let valor = r[c];
        if (Array.isArray(valor)) valor = valor.join(" | ");
        if (valor === null || valor === undefined) valor = "";
        valor = String(valor).replace(/"/g, '""');
        return '"' + valor + '"';
      }).join(";")
    )
  ];

  const blob = new Blob(
    ["\ufeff" + linhas.join("\n")],
    {type:"text/csv;charset=utf-8;"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cadastro_drenagem.csv";
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// LIMPAR
// ============================================================
function limparTudo() {
  if (!confirm("Apagar TODOS os registros salvos neste aparelho?")) return;

  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ============================================================
// UTILITÁRIOS
// ============================================================
function normalizar(texto) {
  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function parseCoordenadas(texto) {
  if (!texto) return null;

  const partes = String(texto).split(",").map(Number);
  if (partes.length !== 2 || partes.some(isNaN)) return null;

  return [partes[0], partes[1]];
}

function escapeHtml(texto) {
  return String(texto ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

renderizarRegistros();
</script>
